<div class="wrap">
  <form class="card" (ngSubmit)="submit()" novalidate>
    <h1>Parolanızı değiştirin</h1>
    @if (required) {
    <p class="sub">Geçici parolayla giriş yaptınız. Devam etmek için kendi parolanızı belirleyin.</p>
    } @else {
    <p class="sub">{{ auth.user()?.fullName }}</p>
    }

    <label>Mevcut (geçici) parola
      <input type="password" name="currentPassword" [(ngModel)]="currentPassword" autocomplete="current-password" />
    </label>
    <label>Yeni parola
      <input type="password" name="newPassword" [(ngModel)]="newPassword" autocomplete="new-password" />
    </label>
    <label>Yeni parola (tekrar)
      <input type="password" name="repeatPassword" [(ngModel)]="repeatPassword" autocomplete="new-password" />
    </label>
    <p class="hint">En az {{ minLength }} karakter.</p>

    @if (error()) { <div class="error" role="alert">{{ error() }}</div> }

    <button type="submit" [disabled]="saving()">{{ saving() ? 'Kaydediliyor…' : 'Parolayı değiştir' }}</button>
    <button type="button" class="link" (click)="auth.logout()">Çıkış yap</button>
  </form>
</div>
