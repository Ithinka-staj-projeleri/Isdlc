<h1>ISDLC</h1>
@if (auth.user(); as user) {
<app-global-search />
<span class="spacer"></span>
<app-notification-bell />
<a class="user" [routerLink]="['/users', user.id]" title="Profilim">{{ user.fullName }} · {{ roleLabels[user.role] }}</a>
<button type="button" (click)="auth.logout()">Çıkış</button>
} @else {
<span class="spacer"></span>
}
