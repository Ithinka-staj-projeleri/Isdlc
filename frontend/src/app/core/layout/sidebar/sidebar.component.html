<div class="brand">
    <b>ISDLC Analiz Merkezi</b>
    <span>Yazılım Departmanı</span>
</div>
<nav>
    @for (group of groups(); track group.title) {
    <h6>{{ group.title }}</h6>
    @for (item of group.items; track item.path) {
    <a [routerLink]="item.path" routerLinkActive="on">{{ item.label }}</a>
    }
    }
</nav>
