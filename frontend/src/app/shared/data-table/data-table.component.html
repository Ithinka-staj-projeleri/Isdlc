<table>
    <thead>
        <tr>
            @for (c of columns(); track c.key) {
            <th>{{ c.label }}</th>
            }
        </tr>
    </thead>
    <tbody>
        @for (row of rows(); track $index) {
        <tr (click)="rowClick.emit(row)">
            @for (c of columns(); track c.key) {
            <td>
                @if (cellTemplate(); as tpl) {
                <ng-container [ngTemplateOutlet]="tpl" [ngTemplateOutletContext]="{ $implicit: row, column: c }" />
                } @else {
                {{ row[c.key] }}
                }
            </td>
            }
        </tr>
        } @empty {
        <tr>
            <td class="empty" [attr.colspan]="columns().length">Kayıt bulunamadı</td>
        </tr>
        }
    </tbody>
</table>
