name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Only needed so the app can be built for the migration check; no database is used.
      ConnectionStrings__Default: Server=localhost;Database=Isdlc;User Id=ci;Password=ci;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore backend/Isdlc.sln
          dotnet tool restore

      - name: Build (warnings are errors)
        run: dotnet build backend/Isdlc.sln --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test backend/Isdlc.sln --no-build --configuration Release

      - name: Check for missing migration
        run: >
          dotnet ef migrations has-pending-model-changes
          --project backend/src/Isdlc.Infrastructure
          --startup-project backend/src/Isdlc.Api
          --configuration Release
          --no-build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npx ng test --watch=false
