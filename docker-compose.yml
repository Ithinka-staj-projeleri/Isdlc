# Local development services.
# Database: copy .env.example to .env, then run `docker compose up -d`.
# AI agent service (optional): copy ai/.env.example to ai/.env, add GEMINI_API_KEY,
# then run `docker compose --profile ai up -d --build`.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: isdlc-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - isdlc-mssql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Called only by the backend (Agents:ServiceUrl). Not started by a plain `docker compose up`.
  ai:
    profiles: [ai]
    build: ./ai
    container_name: isdlc-ai
    env_file:
      - path: ai/.env
        required: false
    ports:
      - "${AI_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  isdlc-mssql-data:
